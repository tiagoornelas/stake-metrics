# Base
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:dev-secret-token-key-change-me}
app.frontend.base.url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.backend.queue.base.url=${APP_BACKEND_QUEUE_BASE_URL:http://172.17.0.1:8080}
service.api.key=${SERVICE_API_KEY:stakemetrics-service-token-dev}
logging.level.org.springframework.security=INFO

# Admin
admin.master.key=${ADMIN_MASTER_KEY:dev-admin-master-key}

# GCP
app.gcp.location.id=${GCP_LOCATION_ID:us-central1}
app.gcp.project.id=${GCP_PROJECT_ID:stake-metrics-demo}

# Database
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stakemetrics}
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-version=1

# Integrations
bets.api.token=${BETS_API_TOKEN:dummy-bets-api-token}

# AutoBettor Webhook
autobettor.webhook.url=${AUTOBETTOR_WEBHOOK_URL:}
autobettor.webhook.token=${AUTOBETTOR_WEBHOOK_TOKEN:}

# Stripe
stripe.pricing.table=${STRIPE_PRICING_TABLE:prctbl_dummy_light}
stripe.dark.mode.pricing.table=${STRIPE_DARK_MODE_PRICING_TABLE:prctbl_dummy_dark}
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_placeholder}

# Brevo
brevo.api.key=${BREVO_API_KEY:dummy-brevo-api-key}
app.mail.sender=${APP_MAIL_SENDER:support@stakemetrics.net}

# Telegram
telegram.api.id=${TELEGRAM_API_ID:0}
telegram.api.hash=${TELEGRAM_API_HASH:dummy_hash}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:dummy_token}
