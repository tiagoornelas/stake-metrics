name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Change directory to back-end
      run: cd back-end

    - name: Verify gradlew presence
      run: test -f ./gradlew

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Build with Gradle
      run: ./gradlew build

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Change directory to front-end
      run: cd front-end

    - name: Install dependencies
      run: npm install

    - name: Build React app
      run: npm run build
